plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.orthodox.charity'
    compileSdk 34

    defaultConfig {
        applicationId "com.orthodox.charity"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.02.02')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.material3:material3'

    // Нужно для ComponentActivity / LifecycleOwner / PaymentActivity из AAR
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // Нужно для Theme.AppCompat.* и AppCompat Activity внутри платежной библиотеки
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Нужно для ThemeOverlay.MaterialComponents.* и Material attrs
    implementation 'com.google.android.material:material:1.11.0'

    // Нужно для activity_qr_scanner.xml: zxing_scanner_layout
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Локальный AAR, сам файл в Git не коммитить
    implementation files('libs/SmartSkyPosLib_v1.9.17.aar')
}
